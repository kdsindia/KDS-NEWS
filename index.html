<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS News Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">
    <header class="bg-blue-600 text-white p-4 shadow-md text-center">
        <h1 class="text-3xl font-bold">🤖 KDS AI न्यूज़ पोर्टल</h1>
        <p class="text-sm mt-1">ताज़ा खबरें, जो आर्टिफिशियल इंटेलिजेंस द्वारा अपडेट होती हैं।</p>
    </header>
    
    <main class="container mx-auto p-4 max-w-4xl" id="news-container">
        <p class="text-center text-gray-500 mt-10">खबरें लोड हो रही हैं...</p>
    </main>

    <script>
        fetch('data/news.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('news-container');
                container.innerHTML = '';
                data.forEach(item => {
                    container.innerHTML += `
                        <div class="bg-white p-6 rounded-lg shadow-md mb-6 border-l-4 border-blue-500">
                            <span class="text-xs bg-blue-100 text-blue-800 font-semibold px-2.5 py-0.5 rounded">${item.category || 'General'}</span>
                            <h2 class="text-xl font-bold mt-2 text-gray-800">${item.headline}</h2>
                            <p class="text-gray-600 mt-2">${item.summary}</p>
                            <div class="mt-4 flex justify-between items-center text-sm text-gray-500">
                                <span>प्रकाशित: ${item.published_at || 'हाल ही में'}</span>
                                <a href="${item.link}" target="_blank" class="text-blue-600 font-semibold hover:underline">मूल स्रोत पढ़ें &rarr;</a>
                            </div>
                        </div>
                    `;
                });
            }).catch(() => {
                document.getElementById('news-container').innerHTML = '<p class="text-center text-red-500">खबरें लोड करने में समस्या आ रही है।</p>';
            });
    </script>
</body>
</html>
